name: 功能建议
description: 说明使用场景与希望解决的问题
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 在什么场景遇到什么问题？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望完成的操作与结果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的方法与限制（可选）
